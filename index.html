<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/sytle.css">
    <script src="./assets/app.js" defer></script>
</head>
<body>

    <header>

        <div id="headerTittle"><h1 id="hTittle">Pokedex</h1></div>
        <div id="headerInput">
            <input type="text" placeholder="Digite o ID ou nome do Pokemon" id="pokeNID" onkeydown="if(event.key ==='Enter') pokemonSearch()" >
            <button onclick="pokemonSearch()" id="searchBtn">Buscar</button>
        </div>
    
    </header>
    
    <main>
        
        <section class="pokemonContainer">
            <h2 id="pokemonName"></h2>
            <div id="pokemonMain">
                    <img src="https://cdn-icons-png.flaticon.com/512/57/57108.png" alt="pokemon" id="pokeImg">
                    <div id="pokemonDetails">
                        <p class="pokeinfo00"></p>
                        <p class="pokeinfo01"></p>
                        <p class="pokeinfo02"></p>
                        <p class="pokeinfo03"></p>
                        <div id="btns">
                            <button id="prev" onclick="pokemonAnterior()">Anterior</button> <button id="next" onclick="pokemonProximo()">Proximo</button>
                        </div>
                    </div>
            </div>
        </section>
    </main>

</body>
</html>
