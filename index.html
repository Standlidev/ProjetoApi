<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sytle.css">
    <script src="app.js"></script>
</head>
<body>

    <header>

        <div id="headerTittle"><h1 id="hTittle">Pokedex</h1></div>
        <div id="headerInput">
            <input type="text" placeholder="Digite o ID ou nome do Pokemon" id="pokeNID">
            <button onclick="pokemonSearch()" id="searchBtn">Buscar</button>
        </div>
    
    </header>
    
    <main>

        <div class="pokemonContainer">
            <div id="pokemonName"></div>
            <div id="pokemonMain">
                    <img src="" alt="pokemon" id="pokeImg">
                    <div id="pokemonDetails">
                        <div class="pokeinfo00"></div>
                        <div class="pokeinfo01"></div>
                        <div class="pokeinfo02"></div>
                        <div class="pokeinfo03"></div>
                        <div id="btns">
                            <button id="prev">Anterior</button> <button id="next">Proximo</button>
                        </div>
                    </div>
            </div>
        </div>
    </main>

</body>
</html>
